# Durar · Supabase CLI settings. Used only by GitHub Actions: `supabase start` in the backup check
# (a local copy with every migration and the fake data in seed.sql), and `supabase db push`, which
# applies supabase/migrations to staging and production (.github/workflows/migrations.yml).
# The hosted projects' own settings live in the Supabase dashboard, not here.
project_id = "durar"

[db]
port = 54322
# Production's Postgres major version (supabase/baseline-check.sql shows it).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Only the database and sign-in are needed locally.
[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[local_smtp]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
