name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database tests (RLS, subscriptions)
        run: npm run test:db
        env:
          CI: 'true'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Unit + server tests (schedule, emails, handlers against PostgreSQL)
        run: npm run test:unit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Serverless functions load as plain Node ESM (like on Vercel)
        run: npm run check:functions

  images:
    # Renders what img.durar.space doesn't have yet (illustrations, then word cards) and uploads it, so a
    # pull request's preview and, after merging, the live site find it there. Pull requests from forks get
    # no secrets, so they skip this.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: images-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base branch's illustrations (the report lists what this pull request adds or changes)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .illustrations
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:src/data/illustrations.json > .illustrations/base.json 2>/dev/null || echo '[]' > .illustrations/base.json
      - name: Illustrations (archive new sources once, render and upload what's missing)
        run: npm run illustrations -- --upload --base=.illustrations/base.json
        env:
          IMAGES_AWS_ACCESS_KEY_ID: ${{ secrets.IMAGES_AWS_ACCESS_KEY_ID }}
          IMAGES_AWS_SECRET_ACCESS_KEY: ${{ secrets.IMAGES_AWS_SECRET_ACCESS_KEY }}
      - name: Illustration report on the pull request
        # Updates the sticky comment; only starts one when there is something to show.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f .illustrations/report.md ] || exit 0
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- durar:illustrations -->")) | .id' | head -n1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@.illustrations/report.md > /dev/null
          elif grep -q '^| ' .illustrations/report.md; then gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@.illustrations/report.md > /dev/null; fi
      # Cards don't wait on illustrations: a bad plate must not hold back new words' link previews.
      - if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Render and upload missing cards
        if: ${{ !cancelled() }}
        run: npm run cards -- --upload
        env:
          IMAGES_AWS_ACCESS_KEY_ID: ${{ secrets.IMAGES_AWS_ACCESS_KEY_ID }}
          IMAGES_AWS_SECRET_ACCESS_KEY: ${{ secrets.IMAGES_AWS_SECRET_ACCESS_KEY }}
      - name: Everything is on img.durar.space
        if: ${{ !cancelled() }}
        run: npm run illustrations -- --check && npm run cards -- --check

  build-and-test:
    runs-on: ubuntu-latest
    # The browser tests take 13–17 minutes under software WebGL, and setup 1–8 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run build
        env:
          # Any absolute URL: lets the build emit sitemap.xml and canonical tags for the tests.
          SITE_URL: https://durar.example
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
