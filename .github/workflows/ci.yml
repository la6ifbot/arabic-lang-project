name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database tests (RLS, subscriptions)
        run: npm run test:db
        env:
          CI: 'true'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Unit + server tests (schedule, emails, handlers against PostgreSQL)
        run: npm run test:unit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Serverless functions load as plain Node ESM (like on Vercel)
        run: npm run check:functions

  card-images:
    # Renders the card images (link previews, daily email) that img.durar.space doesn't have yet and
    # uploads them, so a pull request's preview and, after merging, the live site find them there.
    # Pull requests from forks get no secrets, so they skip this.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: card-images-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render and upload missing cards
        run: npm run cards -- --upload
        env:
          IMAGES_AWS_ACCESS_KEY_ID: ${{ secrets.IMAGES_AWS_ACCESS_KEY_ID }}
          IMAGES_AWS_SECRET_ACCESS_KEY: ${{ secrets.IMAGES_AWS_SECRET_ACCESS_KEY }}
      - name: Every word's card is on img.durar.space
        run: npm run cards -- --check

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run build
        env:
          # Any absolute URL: lets the build emit sitemap.xml and canonical tags for the tests.
          SITE_URL: https://durar.example
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
