name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  # The Sheet import's pull requests are pushed with the workflow token, which starts no push or
  # pull_request runs, so import-sheet.yml starts this workflow on its branch instead.
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database tests (RLS, subscriptions)
        run: npm run test:db
        env:
          CI: 'true'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Unit + server tests (schedule, emails, handlers against PostgreSQL)
        run: npm run test:unit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Serverless functions load as plain Node ESM (like on Vercel)
        run: npm run check:functions

  build-and-test:
    runs-on: ubuntu-latest
    # The browser tests take 13–17 minutes under software WebGL, and setup 1–8 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run build
        env:
          # Any absolute URL: lets the build emit sitemap.xml and canonical tags for the tests.
          SITE_URL: https://durar.example
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
